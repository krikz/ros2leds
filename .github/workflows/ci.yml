name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    name: pytest (no ROS, no hardware)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # numpy: led_matrix_effects; pillow: its preview test (skipped without it)
        run: python -m pip install pytest pyyaml numpy pillow
      # tests/conftest.py stubs rclpy, std_msgs, sensor_msgs and pi5neo,
      # so the driver and compositor nodes run without ROS and without SPI;
      # led_matrix_effects is pure numpy and needs no stubs.
      - name: pytest
        run: python -m pytest tests -v -p no:cacheprovider

  colcon:
    name: colcon build + node smoke (ROS 2 Humble)
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/ros2leds
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-yaml python3-numpy
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select led_matrix_driver led_matrix_compositor led_matrix_effects \
            --event-handlers console_direct+
      # No SPI in CI: pi5neo is absent, so the driver starts in simulation
      # mode. The smoke test checks that both nodes come up with the
      # packaged configs and that one image sent to a logical group comes
      # out as a full strip.
      - name: Effects package smoke test
        run: |
          source install/setup.bash
          share_c=$(ros2 pkg prefix led_matrix_compositor)/share/led_matrix_compositor
          python3 src/ros2leds/.github/ci/smoke_effects.py "$share_c/config/led_matrix_compositor.yaml"
      - name: Node smoke test
        run: |
          source install/setup.bash
          share_c=$(ros2 pkg prefix led_matrix_compositor)/share/led_matrix_compositor
          share_d=$(ros2 pkg prefix led_matrix_driver)/share/led_matrix_driver
          # The driver node is named led_matrix_simple in code while its YAML
          # is keyed led_matrix_driver: without the remap the packaged
          # parameters are silently ignored (num_leds would stay 253).
          ros2 run led_matrix_driver led_matrix_driver --ros-args -r __node:=led_matrix_driver \
            --params-file "$share_d/config/led_matrix_driver.yaml" > driver.log 2>&1 &
          ros2 run led_matrix_compositor led_matrix_compositor --ros-args \
            -p config_file:="$share_c/config/led_matrix_compositor.yaml" > compositor.log 2>&1 &
          sleep 3
          status=0
          python3 src/ros2leds/.github/ci/smoke_compositor.py || status=$?
          num_leds=$(ros2 param get /led_matrix_driver num_leds || true)
          echo "driver num_leds: $num_leds"
          kill %1 %2 || true
          wait || true
          echo '--- driver.log';     cat driver.log
          echo '--- compositor.log'; cat compositor.log
          grep -q 'LED Matrix Simple Driver is ready' driver.log
          grep -q 'Compositor configuration loaded from YAML' compositor.log
          grep -q 'LED Matrix Compositor is ready' compositor.log
          echo "$num_leds" | grep -q 'Integer value is: 381'
          exit $status
